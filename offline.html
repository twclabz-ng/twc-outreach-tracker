<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline — TWC Outreach</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: linear-gradient(160deg, #0D5C63 0%, #0A2A3A 100%);
    color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .card {
    max-width: 340px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px; padding: 32px 24px;
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  p { font-size: 14px; opacity: 0.8; line-height: 1.55; margin-bottom: 24px; }
  button {
    background: #fff; color: #0D5C63; border: none;
    border-radius: 12px; padding: 14px 24px;
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>TWC Outreach needs a network connection to load patient data. Your cached shell is still available.</p>
  <button onclick="location.reload()">Retry Connection</button>
</div>
</body>
</html>
